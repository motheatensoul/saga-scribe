<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            // Apply theme immediately to prevent flash
            // Note: This runs before Tauri is initialized, so we can't use Tauri commands
            // The proper theme will be applied after settings load
            (function () {
                try {
                    // Try to load cached theme from localStorage
                    const cachedTheme =
                        localStorage.getItem("saga-scribe-theme");
                    let theme = cachedTheme || "system";

                    // Get effective theme
                    let effectiveTheme = theme;
                    if (theme === "system" || !theme) {
                        // Fallback to media query for initial load
                        // Note: On Linux, this may not always reflect GNOME settings
                        // The Tauri backend will apply the correct theme after initialization
                        effectiveTheme = window.matchMedia(
                            "(prefers-color-scheme: dark)",
                        ).matches
                            ? "dark"
                            : "light";
                    }

                    // Apply DaisyUI theme
                    const themeMap = {
                        light: "caramellatte",
                        dark: "coffee",
                    };

                    document.documentElement.setAttribute(
                        "data-theme",
                        themeMap[effectiveTheme],
                    );
                } catch (e) {
                    // Fallback to light theme
                    document.documentElement.setAttribute(
                        "data-theme",
                        "caramellatte",
                    );
                }
            })();
        </script>
        <style>
            /* Until the app's styles load: the theme's background, and the
               splash shown while the app starts (removed by +layout.svelte) */
            html[data-theme="caramellatte"] { background: rgb(255 247 237); color: rgb(124 40 8); }
            html[data-theme="coffee"] { background: rgb(38 27 37); color: rgb(197 159 97); }
            #app-splash {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
                background: inherit;
                transition: opacity 0.2s ease-out;
            }
            #app-splash.done { opacity: 0; pointer-events: none; }
        </style>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div id="app-splash" role="status" aria-label="Loading Saga Scribe">
            <!-- SVG animation: keeps turning while the app's scripts load -->
            <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
                <image href="/logo.png" x="16" y="16" width="88" height="88" />
                <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-opacity="0.15" stroke-width="4" />
                <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" stroke-dasharray="80 260">
                    <animateTransform attributeName="transform" type="rotate"
                        from="0 60 60" to="360 60 60" dur="1.2s" repeatCount="indefinite" />
                </circle>
            </svg>
        </div>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
