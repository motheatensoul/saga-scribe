[package]
name = "saga-scribe"
version = "0.6.0"
description = "TEI-XML manuscript transcription editor with custom DSL shorthand"
authors = ["Autumn Carcosa"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "saga_scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", features = ["json"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
libxml = "0.3"
tokio = { version = "1.49.0", features = ["sync"] }

# Platform webview access for direct PDF export (commands/pdf.rs). Same versions
# as wry uses, so nothing extra is compiled.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-strings = "0.5"
