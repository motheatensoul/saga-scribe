name: Build

on:
  push:
    branches: [main]
  # Manual runs (e.g. to check a dev branch on every platform before merging).
  # They only build unless "publish" is set, so the nightly release isn't replaced.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as the nightly release
        type: boolean
        default: false

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

# One build per branch at a time; a newer push waits rather than cancelling one
# that may be halfway through replacing the nightly
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each nightly is a new release of the commit it was built from, so it lists
  # above older releases and holds only this build's files. It's built as a
  # draft and replaces the previous nightly only once every platform succeeded.
  prepare-nightly:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Remove drafts left by failed nightly builds
        if: env.PUBLISH == 'true'
        run: |
          gh api --paginate "repos/$REPO/releases" \
            --jq '.[] | select(.draft and .tag_name == "nightly") | .id' |
            while read -r id; do gh api -X DELETE "repos/$REPO/releases/$id"; done

      - name: Create the draft nightly
        id: draft
        if: env.PUBLISH == 'true'
        run: |
          short="${GITHUB_SHA::7}"
          date="$(date -u +%Y-%m-%d)"
          stable="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          body="Development build of $short from \`main\`, $date. Nightlies are untested and may be unstable; for everyday work use the [latest release](https://github.com/$REPO/releases/latest).

          Changes since $stable: https://github.com/$REPO/compare/$stable...$GITHUB_SHA"
          id="$(gh api "repos/$REPO/releases" \
            -f tag_name=nightly \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Saga-Scribe Nightly $date ($short)" \
            -f body="$body" \
            -F draft=true \
            -F prerelease=true \
            --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  test-tauri:
    needs: prepare-nightly
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-15-intel' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.platform }}${{ matrix.args }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxml2-dev

      - name: install dependencies (macos only)
        if: matrix.platform == 'macos-15-intel' || matrix.platform == 'macos-latest'
        run: |
          brew install libxml2
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install libxml2 (windows only)
        if: matrix.platform == 'windows-latest'
        uses: ./.github/actions/setup-libxml2-windows

      - name: install frontend dependencies
        run: bun install
      - uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          # Uploads to the draft nightly; without a release (manual runs
          # without "publish") the action only builds
          releaseId: ${{ needs.prepare-nightly.outputs.release_id }}
          args: ${{ matrix.args }}

  build-flatpak:
    needs: test-tauri
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - uses: actions/checkout@v5

      # The app itself is compiled inside the GNOME SDK (see the manifest), so
      # it links the runtime's libraries; only the frontend is built here
      - name: Install unzip (for setup-bun)
        run: command -v unzip || dnf install -y unzip

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/app.sagascribe.Sagascribe.yml
          bundle: saga-scribe-nightly.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      # Attached by publish-nightly: the container has no gh, and uploading by
      # tag would find the previous nightly rather than the draft
      - name: Keep the Flatpak for the nightly
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: flatpak-nightly
          path: saga-scribe-nightly.flatpak
          retention-days: 1

  publish-nightly:
    needs: [prepare-nightly, test-tauri, build-flatpak]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.prepare-nightly.outputs.release_id }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: flatpak-nightly

      - name: Attach the Flatpak
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @saga-scribe-nightly.flatpak \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=saga-scribe-nightly.flatpak"

      # Publishing the draft creates the nightly tag at the built commit
      - name: Replace the previous nightly
        run: |
          if old="$(gh api "repos/$REPO/releases/tags/nightly" --jq .id 2>/dev/null)"; then
            gh api -X DELETE "repos/$REPO/releases/$old"
          fi
          gh api -X DELETE "repos/$REPO/git/refs/tags/nightly" 2>/dev/null || true
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=true -f make_latest=false > /dev/null
