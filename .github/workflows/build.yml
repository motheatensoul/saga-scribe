name: Build

on:
  push:
    branches: [main]
  # Manual runs (e.g. to check a dev branch on every platform before merging).
  # They only build unless "publish" is set, so the nightly release isn't replaced.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as the nightly release
        type: boolean
        default: false

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  test-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-15-intel' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.platform }}${{ matrix.args }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxml2-dev

      - name: install dependencies (macos only)
        if: matrix.platform == 'macos-15-intel' || matrix.platform == 'macos-latest'
        run: |
          brew install libxml2
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install libxml2 (windows only)
        if: matrix.platform == 'windows-latest'
        uses: ./.github/actions/setup-libxml2-windows

      - name: install frontend dependencies
        run: bun install
       # If tagName and releaseId are omitted tauri-action will only build the app and won't try to upload any assets.
      - uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          # Without a tag name the action only builds (manual runs without "publish")
          tagName: ${{ env.PUBLISH == 'true' && 'nightly' || '' }}
          releaseName: 'Saga-Scribe Nightly'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

  build-flatpak:
    needs: test-tauri
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      # The app itself is compiled inside the GNOME SDK (see the manifest), so
      # it links the runtime's libraries; only the frontend is built here
      - name: Install unzip (for setup-bun)
        run: command -v unzip || dnf install -y unzip

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/app.sagascribe.Sagascribe.yml
          bundle: saga-scribe-nightly.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak to Nightly Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          files: saga-scribe-nightly.flatpak
          token: ${{ secrets.PAT_TOKEN }}
