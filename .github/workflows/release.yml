name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating full changelog"
            CHANGELOG=$(git log --pretty=format:'- %s (%h)' --no-merges)
          else
            echo "Generating changelog since $PREV_TAG"
            CHANGELOG=$(git log ${PREV_TAG}.. --pretty=format:'- %s (%h)' --no-merges)
          fi

          # Write to file for multi-line output
          echo "$CHANGELOG" > changelog.txt
          echo "changelog_file=changelog.txt" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Saga-Scribe ${{ inputs.version }}
          body_path: changelog.txt
          draft: false
          prerelease: ${{ inputs.prerelease }}
          token: ${{ secrets.PAT_TOKEN }}

  build-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            artifact_suffix: 'macos-arm64'
          # Built natively: on an arm64 runner it would be a cross-compile, and
          # Homebrew's libxml2 there is arm64 only
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin'
            artifact_suffix: 'macos-x64'
          - platform: 'ubuntu-latest'
            args: ''
            artifact_suffix: 'linux-x64'
          - platform: 'windows-latest'
            args: ''
            artifact_suffix: 'windows-x64'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          cache-key: ${{ matrix.artifact_suffix }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxml2-dev

      - name: Install dependencies (macos only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install libxml2
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install libxml2 (windows only)
        if: matrix.platform == 'windows-latest'
        uses: ./.github/actions/setup-libxml2-windows

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  build-flatpak:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - uses: actions/checkout@v5

      # The app itself is compiled inside the GNOME SDK (see the manifest), so
      # it links the runtime's libraries; only the frontend is built here
      - name: Install unzip (for setup-bun)
        run: command -v unzip || dnf install -y unzip

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/app.sagascribe.Sagascribe.yml
          bundle: saga-scribe.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Name the Flatpak bundle
        run: mv saga-scribe.flatpak saga-scribe-${{ inputs.version }}-linux-x64.flatpak

      - name: Upload Flatpak to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: saga-scribe-${{ inputs.version }}-linux-x64.flatpak
          token: ${{ secrets.PAT_TOKEN }}
